<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./track-and-manage.css">
</head>
<body>
    <div class="container">
        <p class="view">View or Manage Your Order</p>
        <p class="to-check">To check the status of your order, or to start a &nbsp;&nbsp;return, please enter your order number and &nbsp;&nbsp;&nbsp;email address.</p>
         <div class="input-box">
              
            <input type="text" id="order-number" name="order-number" >
            <label for="order-number">Order Number*</label>
         
         </div>
        
         <div class="input-box">
            <input type="email" id="email-address" name="email-address">
            <label for="email-address">Email address*</label>
         </div>

         <div class="submit">
            <input type="submit" value="Submit">
         </div>

    </div>
    
</body>
</html>
